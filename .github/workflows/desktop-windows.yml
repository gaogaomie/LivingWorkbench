name: Windows desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: bun install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - run: bun run --cwd apps/desktop typecheck
      - run: bun run test:desktop
      - run: bun run package:desktop:win
      - name: Test packaged Windows application
        shell: pwsh
        run: |
          $env:DESKTOP_EXECUTABLE = Join-Path $PWD 'apps/desktop/release/win-unpacked/DailyLife.exe'
          bun run test:desktop:e2e
      - uses: actions/upload-artifact@v4
        with:
          name: DailyLife-windows-x64
          path: apps/desktop/release/*-windows-x64-setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-desktop-test-results
          path: apps/desktop/test-results/
